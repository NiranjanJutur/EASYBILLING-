<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#FDF6EC" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="description" content="FamilyOS - The smart operating system for your grocery shop. Manage inventory, udhaar, billing and customers." />
  <meta name="keywords" content="FamilyOS, retail, billing, udhaar, inventory, POS, dashboard" />
  <meta name="author" content="FamilyOS" />
  <title>FamilyOS - Shop Management Platform</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: #FDF6EC;
      /* COLORS.BACKGROUND */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #root {
      display: flex;
      height: 100%;
      width: 100%;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script>
    window.addEventListener('error', function(event) {
      document.body.innerHTML += '<div style="color: red; padding: 20px; font-family: monospace; font-size: 16px; font-weight: bold; background: #ffebee; border: 2px solid red; margin: 20px; z-index: 9999; position: relative;"><h3>🔥 FATAL ERROR:</h3><p>' + escapeHtml(event.error ? event.error.stack : event.message) + '</p></div>';
    });
    window.addEventListener('unhandledrejection', function(event) {
      document.body.innerHTML += '<div style="color: red; padding: 20px; font-family: monospace; font-size: 16px; font-weight: bold; background: #ffebee; border: 2px solid red; margin: 20px; z-index: 9999; position: relative;"><h3>🔥 PROMISE ERROR:</h3><p>' + escapeHtml(event.reason ? event.reason.stack || event.reason : 'Unknown Promise Rejection') + '</p></div>';
    });
    function escapeHtml(unsafe) {
      return (unsafe || '').toString()
           .replace(/&/g, "&amp;")
           .replace(/</g, "&lt;")
           .replace(/>/g, "&gt;")
           .replace(/"/g, "&quot;")
           .replace(/'/g, "&#039;");
    }
  </script>
  <script type="module" src="/index.web.js"></script>
</body>

</html>
